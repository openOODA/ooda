name: ooda CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.2.12)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout ooda
        uses: actions/checkout@v4
        with:
          path: ooda
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: verify surface and run suite proofs
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for d in build fix fmt token; do test -d "ooda/$d" || { echo "ERR missing ooda/$d"; exit 1; }; done
          test -f ooda/main.oo || { echo "ERR missing ooda/main.oo"; exit 1; }
          for f in ooda/build/args.oo ooda/build/json_check.oo ooda/build/reproducible.oo ooda/fix/patch.oo; do
            test ! -e "$f" || { echo "ERR dead file $f"; exit 1; }
          done
          "${OODA_COMPILER}" build --backend c ooda/qa/suite.oo -o /tmp/ooda_suite
          (cd ooda && /tmp/ooda_suite)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout ooda
        uses: actions/checkout@v4
        with:
          path: ooda
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build --backend c ooda/main.oo -o dist/ooda-linux-x86_64
          chmod +x dist/ooda-linux-x86_64
          (cd dist && sha256sum ooda-linux-x86_64 > ooda-linux-x86_64.sha256)
          ls -lh dist/
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  auto-release:
    needs: [test, build]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@main
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
