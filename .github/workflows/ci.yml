name: cli CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cli self-tests
        run: |
          echo "cli self-test runners: qa/probe_*.oo"
          echo "(stub: real CI requires ooda toolchain; see openOODA/ooda repo)"
      - name: Verify VERSION + api_surface
        run: |
          echo "Declared api_surface: $(grep api_surface VERSION | cut -d= -f2)"
          echo "Actual subdir count:  $(ls -d */ | wc -l)"
          test "$(grep api_surface VERSION | cut -d= -f2)" = "4" || (echo "api_surface drift"; exit 1)
          test "$(ls -d */ | wc -l)" = "8" || (echo "expected 8 subdirs (4 functional + 4 template)"; exit 1)
