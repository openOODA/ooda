name: ooda CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific release tag to target or rebuild (optional, e.g. v0.2.12)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout ooda
        uses: actions/checkout@v4
        with:
          path: ooda
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: build native driver and install to ~/.openooda/bin/ooda
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}:/home/runner
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_HOME: /home/runner
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          mkdir -p ooda/dist
          "${OODA_COMPILER}" build ooda/main.oo -o ooda/dist/ooda
          rm -f "$HOME/.openooda/bin/ooda" && cp ooda/dist/ooda "$HOME/.openooda/bin/ooda"
          chmod +x "$HOME/.openooda/bin/ooda"
          test "$(sha256sum ooda/dist/ooda | awk '{print $1}')" = "$(sha256sum "$HOME/.openooda/bin/ooda" | awk '{print $1}')"
      - name: verify surface and run suite proofs
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}:/home/runner
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_HOME: /home/runner
        run: |
          set -euo pipefail
          test -f ooda/main.oo || { echo "ERR missing ooda/main.oo"; exit 1; }
          test -f ooda/build/spawn.oo || { echo "ERR missing ooda/build/spawn.oo"; exit 1; }
          "${OODA_COMPILER}" check ooda/main.oo
          "${OODA_COMPILER}" build ooda/main.oo -o /tmp/ooda_router
          /tmp/ooda_router --help
          /tmp/ooda_router version
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout ooda
        uses: actions/checkout@v4
        with:
          path: ooda
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: build native binary
        working-directory: ${{ github.workspace }}
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          mkdir -p dist
          "${OODA_COMPILER}" build ooda/main.oo -o dist/ooda-linux-x86_64
          chmod +x dist/ooda-linux-x86_64
          (cd dist && sha256sum ooda-linux-x86_64 > ooda-linux-x86_64.sha256)
          ls -lh dist/
      - name: verify binary digest parity and black-box execution
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.openooda/bin"
          rm -f "$HOME/.openooda/bin/ooda" && cp dist/ooda-linux-x86_64 "$HOME/.openooda/bin/ooda"
          chmod +x "$HOME/.openooda/bin/ooda"
          test "$(sha256sum dist/ooda-linux-x86_64 | awk '{print $1}')" = "$(sha256sum "$HOME/.openooda/bin/ooda" | awk '{print $1}')"
          test "$(sha256sum dist/ooda-linux-x86_64 | awk '{print $1}')" = "$(awk '{print $1}' dist/ooda-linux-x86_64.sha256)"
          "$HOME/.openooda/bin/ooda" version
          "$HOME/.openooda/bin/ooda" --help
      - name: upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-x86_64
          path: dist/
          if-no-files-found: error

  blackbox-gate:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: checkout ooda
        uses: actions/checkout@v4
        with:
          path: ooda
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA/std
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          test -f oodar/core/blackbox/blackbox.c || { echo "missing oodar/core/blackbox/blackbox.c"; exit 1; }
      - name: determinism double-run on qa/ probes (RULES §1.10)
        working-directory: ${{ github.workspace }}/ooda
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/*.diff[12]' EXIT
          shopt -s nullglob
          count=0
          for f in qa/probe_*.oo; do
            test -f "$f" || continue
            count=$((count + 1))
            base=$(basename "$f" .oo)
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff1" 2>&1 || {
              echo "[blackbox-gate FAIL] diff non-zero exit on $f"
              exit 1
            }
            "$OODA_COMPILER" tokens "$f" > "/tmp/${base}.diff2" 2>&1 || {
              echo "[blackbox-gate FAIL] second diff non-zero exit on $f"
              exit 1
            }
            if ! diff -q "/tmp/${base}.diff1" "/tmp/${base}.diff2" >/dev/null; then
              echo "[blackbox-gate FAIL] non-deterministic diff on $f (double-run law violation, RULES §1.10)"
              diff "/tmp/${base}.diff1" "/tmp/${base}.diff2" | head -20
              exit 1
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "[blackbox-gate SKIP] no qa/probe_*.oo in this repo"
            exit 0
          fi
          echo "[blackbox-gate OK] $count probes deterministic across double-run (oodac-native gate)"

  auto-release:
    needs: [test, build, blackbox-gate]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
    with:
      artifact_pattern: 'release-assets-*'
      target_tag: ${{ inputs.target_tag || '' }}
