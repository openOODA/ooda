# Remote product rail: seed bootstrap + smokes + fixed_point (pure .oo product path).
# Does not install host language toolchains. Does not claim beta.
# Seed strategy (first hit wins):
#   1) bootstrap/seed/oodac if executable in checkout
#   2) SEED_OODAC env
#   3) GitHub Release for install/BOOTSTRAP_PIN via gh (authenticated — private repos OK)
name: product

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      seed_url:
        description: "Optional override URL (must be this repo's release tarball)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  product_rails:
    name: product rails
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: System toolchain (gcc/bash only — never rustup/cargo)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          if command -v rustup >/dev/null 2>&1; then
            echo "NOTE: rustup present on runner image; will shadow cargo/rustc"
          fi
          command -v gcc
          command -v bash
          command -v gh

      - name: Shadow cargo/rustc on PATH
        run: |
          set -euo pipefail
          SHADOW="${RUNNER_TEMP}/product_shadow"
          mkdir -p "$SHADOW"
          printf '%s\n' '#!/bin/sh' 'echo ERR_SHADOW_CARGO >&2' 'exit 99' >"$SHADOW/cargo"
          printf '%s\n' '#!/bin/sh' 'echo ERR_SHADOW_RUSTC >&2' 'exit 99' >"$SHADOW/rustc"
          chmod +x "$SHADOW/cargo" "$SHADOW/rustc"
          echo "$SHADOW" >>"$GITHUB_PATH"
          echo "PATH_SHADOW=$SHADOW" >>"$GITHUB_ENV"

      - name: Resolve SEED_OODAC (local seed / env / authenticated release)
        id: seed
        env:
          INPUT_SEED_URL: ${{ github.event.inputs.seed_url || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PIN="$(tr -d '\r\n' <"$ROOT/install/BOOTSTRAP_PIN" | head -1)"
          case "$PIN" in v*) ;; *) PIN="v${PIN}" ;; esac
          ARCH="linux-x86_64"
          NAME="ooda-${PIN}-${ARCH}"
          SEED=""

          if [[ -x "$ROOT/bootstrap/seed/oodac" ]]; then
            SEED="$ROOT/bootstrap/seed/oodac"
            echo "seed: local bootstrap/seed/oodac"
          elif [[ -n "${SEED_OODAC:-}" && -x "${SEED_OODAC}" ]]; then
            SEED="$SEED_OODAC"
            echo "seed: SEED_OODAC env"
          else
            DL="$RUNNER_TEMP/seed_dl"
            mkdir -p "$DL"
            if [[ -n "$INPUT_SEED_URL" ]]; then
              case "$INPUT_SEED_URL" in
                "https://github.com/${{ github.repository }}/releases/download/"*"/${NAME}.tar.gz")
                  echo "seed: override URL (still uses gh for private)"
                  ;;
                *)
                  echo "ERR: seed_url must match this repo release tarball ${NAME}.tar.gz" >&2
                  exit 1
                  ;;
              esac
            fi
            # Authenticated download — works for private org repos (curl without token 404s).
            echo "seed: gh release download ${PIN} asset ${NAME}.tar.gz"
            gh release download "$PIN" \
              --repo "${{ github.repository }}" \
              --pattern "${NAME}.tar.gz" \
              --pattern "${NAME}.tar.gz.sha256" \
              --dir "$DL"
            (
              cd "$DL"
              HASH="$(awk '{print $1}' "${NAME}.tar.gz.sha256" | head -1)"
              echo "${HASH}  ${NAME}.tar.gz" >"_check.sha256"
              sha256sum -c "_check.sha256"
            )
            tar -C "$DL" -xzf "$DL/${NAME}.tar.gz"
            SEED="$DL/${NAME}/oodac/oodac"
            [[ -x "$SEED" ]] || { echo "ERR: oodac missing in release tarball" >&2; exit 1; }
            echo "seed: release $PIN (authenticated gh)"
          fi

          echo "SEED_OODAC=$SEED" >>"$GITHUB_ENV"
          echo "seed_path=$SEED" >>"$GITHUB_OUTPUT"
          ls -la "$SEED"

      - name: Prove cargo/rustc shadowed
        run: |
          set -euo pipefail
          if cargo version 2>/dev/null; then
            echo "FAIL: cargo not shadowed" >&2
            exit 1
          fi
          if rustc --version 2>/dev/null; then
            echo "FAIL: rustc not shadowed" >&2
            exit 1
          fi
          echo "OK cargo/rustc fail-closed on PATH"

      - name: Anti — workflow must not install rust product path
        run: |
          set -euo pipefail
          if grep -nE 'uses:.*(rust-toolchain|actions-rs)|rustup (install|update|default)|cargo (install|build|test|check)' \
            .github/workflows/*.yml 2>/dev/null; then
            echo "FAIL: workflow has cargo/rust product path" >&2
            exit 1
          fi
          echo "OK workflow has no cargo product path"

      - name: Run scripts/ci_product.sh
        run: |
          set -euo pipefail
          export SEED_OODAC
          export TMPDIR="${RUNNER_TEMP}/ooda-tmp"
          mkdir -p "$TMPDIR"
          ./scripts/ci_product.sh

      - name: Dress rehearsal (staged tree offline)
        run: |
          set -euo pipefail
          export SEED_OODAC
          if [[ -d "${RUNNER_TEMP}/seed_dl" ]]; then
            TB=$(ls "${RUNNER_TEMP}/seed_dl"/ooda-*.tar.gz 2>/dev/null | head -1 || true)
            if [[ -n "${TB:-}" && -f "$TB" ]]; then
              RELEASE_TARBALL="$TB" ./scripts/install_dress_rehearsal.sh
              exit 0
            fi
          fi
          ./scripts/install_dress_rehearsal.sh
