[package]
name = "ooda"
version = "0.68.0-alpha"
edition = "2021"
authors = ["openOODA Core Team"]
description = "The OODA Programming Language Compiler, JIT Engine, and Developer Toolchain"
homepage = "https://github.com/openOODA"
repository = "https://github.com/openOODA/ooda"

[lib]
name = "ooda"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "ooda"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
anyhow = "1.0"
thiserror = "1.0"
